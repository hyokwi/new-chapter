const FPS=30;

  let pop=1;
  if(u<0)pop-=0.03*Math.sin(Math.PI*(u+0.15)/0.15);
  else if(u<=0.18)pop+=0.09*Math.sin(Math.PI*u/0.18);
  else pop+=0.025*Math.exp(-(u-0.18)*5)*Math.cos((u-0.18)*25);
  const spark=u>=0?Math.min(1,u/0.1)*Math.exp(-Math.max(0,u-0.4)*2.5):0;
  const star=u>=0&&u<=0.7?Math.sin(Math.PI*u/0.7):0;
  const lines=u>=0?Math.min(1,u/0.12)*(u<0.55?1:Math.max(0,1-(u-0.55)/0.2)):0;

}
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=(t,s=1)=>{t-=1;return t*t*((s+1)*t+s)+1};
// intro story: wake up -> look around -> flash -> blink blink
const WAKE=[[0,1],[0.5,1],[0.85,0.45],[1.0,0.55],[1.15,1],[1.3,1],[1.75,0]];
const GAZE=[[0,0,0],[2.0,0,0],[2.3,-38,-4],[3.0,-38,-4],[3.35,36,-4],[4.0,36,-4],[4.3,-22,14],[4.8,-22,14],[5.05,0,0]];

function intro(t){
  let e=keyLerp(WAKE,t,(a,b,u)=>a[1]+(b[1]-a[1])*ease(u));
  e=Math.max(e,seqAt(FAST,t-3.1),seqAt(BLINK,t-6.0-0.0)*0);
  const gz=keyLerp(GAZE,t,(a,b,u)=>{const k=(a[1]==b[1]&&a[2]==b[2])?0:ease(u)*0.3+back(u)*0.7;return [a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]});

  if(now-lastPointer>3.5&&now>nextGlance){
    const r=Math.random();
